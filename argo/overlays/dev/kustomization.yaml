apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../services/studystack0
  - studystack0-config.yaml
  - studystack0-sealedsecret.yaml
  - studystack0-httpscaledobject.yaml
  - studystack0-interceptor-ingress.yaml
patches:
  # Drop the direct ALB Ingress: dev is fronted through the KEDA interceptor.
  - target:
      kind: Ingress
      name: studystack0
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: studystack0
images:
  - name: studystack0
    newName: 368076259134.dkr.ecr.us-east-1.amazonaws.com/sdk-example
    newTag: sdk-study-stacks
    digest: sha256:d1cbbb4b2931c0f09a196ed97fbbaaf901b67ae579784b66f5d2968cda686bed
